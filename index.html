<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NYC Subway Counter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>NYC Subway Counter</h1>
    <p id="summary"></p>
  </header>

  <main>
    <section class="controls">
      <input id="search" type="search" placeholder="Search stops or lines" />
      <label><input id="unvisitedOnly" type="checkbox" /> Unvisited only</label>
    </section>

    <ul id="stopList" class="stop-list"></ul>
  </main>

  <dialog id="detail">
    <div class="detail-body">
      <button type="button" id="closeDialog" class="close-btn" aria-label="Close">&times;</button>
      <h2 id="detailName"></h2>
      <p id="detailLines" class="lines"></p>

      <button type="button" id="imHere" class="im-here-btn">I'm here!</button>
      <p id="detailVisitCount" class="visit-count-display"></p>

      <h3>Things to do nearby</h3>
      <ul id="detailIdeas"></ul>

      <div id="historySection" class="history-section" hidden>
        <h3>Your visits</h3>
        <ul id="visitHistory"></ul>
        <button type="button" id="removeLastVisit" class="secondary small">Remove last visit</button>
      </div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
