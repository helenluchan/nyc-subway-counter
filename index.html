<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NYC Subway Counter</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-left">
      <h1>NYC Subway Counter</h1>
      <span id="summary"></span>
    </div>
    <div class="view-toggle">
      <button id="mapViewBtn" class="toggle-btn active">Map</button>
      <button id="listViewBtn" class="toggle-btn">List</button>
    </div>
  </header>

  <div class="filter-bar">
    <div id="lineFilters" class="line-filters"></div>
  </div>

  <div id="mapView" class="view-container">
    <div id="map"></div>
  </div>

  <div id="listView" class="view-container" hidden>
    <div class="list-scroll">
      <input id="search" type="search" placeholder="Search stops or lines…" />
      <label class="unvisited-label">
        <input id="unvisitedOnly" type="checkbox" /> Unvisited only
      </label>
      <ul id="stopList"></ul>
    </div>
  </div>

  <dialog id="detail">
    <div class="sheet">
      <button id="closeDialog" class="close-btn" aria-label="Close">&times;</button>
      <div id="detailBullets" class="sheet-bullets"></div>
      <h2 id="detailName"></h2>
      <p id="detailVisitCount" class="visit-count"></p>

      <button id="imHere" class="here-btn">I'm here</button>

      <p class="section-label">Things to do nearby</p>
      <ul id="detailIdeas" class="ideas-list"></ul>

      <div id="historySection" hidden>
        <p class="section-label">Your visits</p>
        <ul id="visitHistory" class="history-list"></ul>
        <button id="removeLastVisit" class="text-btn">Remove last visit</button>
      </div>
    </div>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
